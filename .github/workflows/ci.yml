name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.2.1-alpha.2', '0.2.1-rc.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:peers
      - run: npm run build
      - run: git diff --exit-code -- dist
      - name: Distribution does not define a language
        run: |
          command -v rg >/dev/null
          if rg -n "addLanguage" src dist; then exit 1; fi
      - run: npm run test:compat
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm install --global @deepseek-ai/dsh@${{ matrix.dsh }} pnpm@9.15.0
      - run: npm run test:native
      - name: Pack candidate and download previous official release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/previous-release"
          gh release download v0.3.2 --repo Aero123421/dsh-search-providers --pattern aero123421-dsh-search-providers-0.3.2.tgz --pattern SHA256SUMS --dir "$RUNNER_TEMP/previous-release"
      - name: Verify previous release checksum
        working-directory: ${{ runner.temp }}/previous-release
        run: sha256sum --check SHA256SUMS
      - run: |
          VERSION=$(node -p "require('./package.json').version")
          npm run test:upgrade -- "$RUNNER_TEMP/previous-release/aero123421-dsh-search-providers-0.3.2.tgz" "$RUNNER_TEMP/aero123421-dsh-search-providers-${VERSION:?}.tgz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.dsh }}
          path: artifacts/*.png
